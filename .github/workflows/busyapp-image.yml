name: Build Busy image

on:
  # Auto-build dev image on push to the default branch
  push:
    branches:
      - dev

  # Manual build
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
          - prod

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: "ghcr.io/busy-app/update-indexer"

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false

          tags: |
            type=raw,value=dev-{{sha}}-{{date 'X'}},enable=${{ inputs.environment == 'dev' || github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
            type=raw,value=stage-{{sha}}-{{date 'X'}},enable=${{ inputs.environment == 'stage' }}
            type=raw,value=prod-{{sha}}-{{date 'X'}},enable=${{ inputs.environment == 'prod' }}

          labels: |
            org.opencontainers.image.title=update-indexer
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
